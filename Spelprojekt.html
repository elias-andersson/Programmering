    var pacman = {x: 500, y: 700, size: 30, color: "yellow"}
    var enemies = [
      {x: 800, y: 400, color: "red", speed: 2}, //blinky
      {x: 900, y: 400, color: "#2962FF", speed: 2}, //inky
      {x: 1000, y: 400, color: "orange", speed: 2}, //clyde
      {x: 700, y: 400, color: "pink", speed: 2} //pinky
    ]

    function drawPacman(){
      circle(pacman.x, pacman.y, pacman.size, pacman.color)
      triangle(pacman.x, pacman.y, pacman.x + 30, pacman.y - 20, pacman.x + 30, pacman.y + 20, "black")
    }

    function drawEnemies(){
      for(var i=0;i < enemies.length;i++){
        drawEnemy(enemies[i].x, enemies[i].y,enemies[i].color)
    }
  }
    
    function drawEnemy(x, y, color) {
      save();
      translate(x, y);  
      circle(0, 0, 25, color)
        rectangle(- 25, 0, 50,+ 50, color)
        oval(- 10, 0, 7, 9, "white")
        oval(+ 10, 0, 7, 9, "white")
        circle(- 14, 0, 4, "blue")
        circle(+ 6, 0, 4, "blue")
        oval(- 15, + 50, 6, 9, "black")
        oval(0, + 50, 6, 9, "black")
        oval(+ 15, + 50, 6, 9, "black")
        restore();

    }
    function oval(x, y, rx, ry, color){
        save();
        translate(x, y);
        scale(rx / ry, 1);
        circle(0, 0, ry, color);
        restore();
    }
    

    function update() {
        clearScreen()
        fill("black")
        drawEnemies()
        drawPacman()
     
          
        }
